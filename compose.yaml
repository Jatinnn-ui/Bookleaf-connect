services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookleaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bookleaf}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published port: Postgres is reachable only on the internal network.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bookleaf}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bookleaf}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Set to "false" only when serving over plain HTTP locally.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
